<!doctype html>
<html lang="km">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, height=1440" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
@font-face{font-family:Busra;src:url("assets/fonts/Busra-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:Busra;src:url("assets/fonts/Busra-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:Busra;src:url("assets/fonts/Busra-SemiBold.woff2") format("woff2");font-weight:600}
@font-face{font-family:Busra;src:url("assets/fonts/Busra-Bold.woff2") format("woff2");font-weight:700}
:root{--paper:#f6f4ef;--ink:#14181c;--dim:#6b6862;--line:#ddd7c9;--gold:#8f6316;--goldL:#c99a3c;--goldS:#f6eeda;--green:#1b6b45;--greenS:#e6f0ea;
  --sans:-apple-system,"SF Pro Display","Helvetica Neue",Arial,sans-serif;--km:Busra,-apple-system,sans-serif;--dp:-apple-system,"SF Pro Display","Khmer OS Muol Light",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{width:1440px;height:1440px;overflow:hidden;background:var(--paper)}
body{font-family:var(--sans);color:var(--ink)}
.km{font-family:var(--km);line-height:1.75}
.dp{font-family:var(--dp)}
.tn{font-variant-numeric:tabular-nums}
#root{position:relative;width:1440px;height:1440px;overflow:hidden;background:var(--paper)}
.clip{position:absolute;inset:0}
.frame{position:absolute;inset:44px;border:1px solid var(--line)}
.idx{position:absolute;left:92px;top:88px;display:flex;align-items:center;gap:16px;font-size:26px;color:var(--dim);opacity:0}
.h1{position:absolute;left:92px;right:92px;top:168px;font-size:78px;line-height:1.5;opacity:0}
.stage{position:absolute;left:92px;right:92px;top:330px;height:660px}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px;opacity:0}
.lead{font-size:30px;color:var(--dim);text-align:center}
.cap{position:absolute;left:92px;right:92px;bottom:190px;font-size:42px;line-height:1.7;color:var(--ink);opacity:0}
.sub{position:absolute;left:92px;right:92px;bottom:128px;font-size:30px;color:var(--dim);opacity:0}
.foot{position:absolute;left:92px;bottom:74px;display:flex;align-items:center;gap:16px;opacity:0}
.foot .w{font-size:28px;letter-spacing:7px;color:var(--gold)}
.card{background:#fff;border:1px solid var(--line);padding:28px}
.bub{max-width:82%;padding:32px 40px;font-size:46px;border:1px solid var(--line);background:#fff;opacity:0}
.bub.me{margin-left:auto;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stamp{display:inline-flex;align-items:center;gap:14px;background:var(--greenS);border:1px solid rgba(27,107,69,.35);color:var(--green);font-size:28px;font-weight:600;padding:14px 24px;opacity:0}
.big{font-size:96px;font-weight:600;letter-spacing:-2px;line-height:1.15}
.big small{font-size:44px;color:var(--dim)}

.qr{position:relative;width:470px;background:#fff;border:1px solid var(--line);padding:32px;overflow:hidden}
.qr img{width:100%;display:block}
.qr .a{font-size:64px;font-weight:700;text-align:center;margin-top:24px}
.scan{position:absolute;left:0;right:0;top:0;height:8px;background:var(--goldL);opacity:0}
.paid{display:flex;align-items:center;gap:22px;background:var(--greenS);border:1px solid rgba(27,107,69,.35);color:var(--green);font-size:48px;font-weight:600;padding:28px 34px;opacity:0}</style>
  </head>
  <body>
    <div id="root" data-composition-id="s3" data-start="0" data-width="1440" data-height="1440" data-duration="13" data-fps="30">
      <div id="scene" class="clip" data-start="0" data-duration="13" data-track-index="0" data-layout-allow-overlap>
        <div class="frame"></div>

        <div class="idx km" id="idx"><svg width="38" height="38" viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#14181c"/><rect x="3" y="3" width="30" height="30" rx="6.5" fill="none" stroke="#8f6316" stroke-width="1"/><path d="M10.4 25.6V10.4h3.9l4.2 7.4 4.2-7.4h3.9v15.2h-3.6v-8.9l-3.6 6.3h-1.8l-3.6-6.3v8.9Z" fill="#c99a3c"/></svg><span>៣ ក្នុង ៤ · មុខងារស្នូល</span></div>
        <div class="h1 dp" id="h1">ទទួលប្រាក់តាម KHQR</div>
        <div class="stage">
          <div class="layer" id="L1">
            <div class="qr"><div class="scan" id="scan"></div><img src="assets/qr.svg"><div class="a km tn">៤៦.៥០$</div></div>
            <div class="lead km" id="lead">អតិថិជនស្កេនពីកម្មវិធីធនាគារ</div>
          </div>
          <div class="layer" id="L2"><div class="paid km tn" id="paid"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#1b6b45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg> បានទទួល ៤៦.៥០$</div></div>
        </div>
        <div class="cap km" id="cap">Moni ផ្ញើ QR ជូនរាល់ការបញ្ជាទិញ</div>
        <div class="sub km" id="sub">មិនបាច់ប្រាប់លេខគណនី លុយចូល អ្នកដឹងភ្លាម</div>
        <div class="foot" id="foot"><svg width="40" height="40" viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#14181c"/><rect x="3" y="3" width="30" height="30" rx="6.5" fill="none" stroke="#8f6316" stroke-width="1"/><path d="M10.4 25.6V10.4h3.9l4.2 7.4 4.2-7.4h3.9v15.2h-3.6v-8.9l-3.6 6.3h-1.8l-3.6-6.3v8.9Z" fill="#c99a3c"/></svg><div class="w dp">MONI</div></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const E = "power3.out";
      const rise = (sel, t, d = 0.6, y = 26) => tl.fromTo(sel, { y, opacity: 0 }, { y: 0, opacity: 1, duration: d, ease: E }, t);
      const pop = (sel, t, d = 0.6) => tl.fromTo(sel, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: d, ease: E }, t);

      rise("#idx", 0.2, 0.5, 12); rise("#h1", 0.5, 0.8);
      pop("#L1", 1.6, 0.7);
      tl.set("#scan", { y: 0 }, 0)
        .to("#scan", { opacity: 1, duration: 0.2 }, 3.4)
        .fromTo("#scan", { y: 0 }, { y: 470, duration: 1.6, ease: "power1.inOut" }, 3.5)
        .to("#scan", { opacity: 0, duration: 0.25 }, 5.0);
      tl.to("#lead", { opacity: 0, duration: 0.3 }, 5.4)
        .to("#L1", { opacity: 0, scale: 0.96, duration: 0.5, ease: "power2.in" }, 5.7);
      tl.set("#L2", { opacity: 1 }, 0);
      pop("#paid", 6.1, 0.7);
      rise("#cap", 7.6, 0.7); rise("#sub", 8.2, 0.6); rise("#foot", 9.0, 0.6, 14);
      window.__timelines["s3"] = tl;
    </script>
  </body>
</html>
