<!doctype html><html lang="km"><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
html,body{width:1080px;height:1440px;overflow:hidden;background:#000}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,"Khmer Sangam MN",sans-serif}
.km{font-family:-apple-system,"SF Pro Text","Helvetica Neue","Khmer Sangam MN",sans-serif;line-height:1.75}
.screen{position:absolute;top:0;left:0;width:540px;height:720px;transform:scale(2);transform-origin:0 0;overflow:hidden;background:#fff}
.sb{height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 6px;font-size:15px;font-weight:600;letter-spacing:.2px}
.sb .r{display:flex;align-items:center;gap:5px}
.spacer{flex:1}
img{display:block}
@font-face{font-family:Busra;src:url("../assets/fonts/Busra-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:Busra;src:url("../assets/fonts/Busra-Medium.woff2") format("woff2");font-weight:500}
@font-face{font-family:Busra;src:url("../assets/fonts/Busra-SemiBold.woff2") format("woff2");font-weight:600}
@font-face{font-family:Busra;src:url("../assets/fonts/Busra-Bold.woff2") format("woff2");font-weight:700}

.nav{height:52px;display:flex;align-items:center;gap:20px;padding:0 16px;background:#fff}
.nav .rt{margin-left:auto;display:flex;gap:20px}
.hero{width:100%;height:192px;object-fit:cover;background:#EBEDF0}
.body{padding:13px 17px 0}
.price{font-size:25px;font-weight:700;letter-spacing:-.6px;color:#080809}
.title{font-size:15.5px;color:#080809;margin-top:3px}
.meta{font-size:12px;color:#65686C;margin-top:5px}
.btns{display:flex;gap:9px;margin-top:12px}
.b1{flex:1;height:40px;background:#0866FF;color:#fff;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.b2{width:112px;height:40px;background:#E4E6EB;color:#080809;border-radius:8px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.hr{height:1px;background:#E4E6EB;margin:13px 0}
.h2{font-size:15px;font-weight:600;color:#080809;margin-bottom:9px}
.sell{display:flex;align-items:center;gap:11px}
.sell .nm{font-size:14px;font-weight:600}
.sell .sb2{font-size:11.5px;color:#65686C}
.ins{display:flex;border:1px solid #E4E6EB;border-radius:10px;margin-top:12px}
.ins div{flex:1;padding:8px 12px;border-right:1px solid #E4E6EB}
.ins div:last-child{border-right:0}
.ins .k{font-size:10.5px;color:#65686C}
.ins .v{font-size:17px;font-weight:700;margin-top:1px}
.moni{display:flex;align-items:center;gap:8px;background:#F7F3E9;border:1px solid #EADFC4;border-radius:10px;padding:10px 12px;margin-top:12px;font-size:11.5px;color:#7A5A18}
</style></head><body><div class="screen" style="background:#fff">

  </div>
  <div class="moni km"><svg width="15" height="15" viewBox="0 0 36 36"><rect width="36" height="36" rx="9" fill="#14181C"/><rect x="3" y="3" width="30" height="30" rx="6.5" fill="none" stroke="#C08A2E" stroke-width="1"/><path d="M10.4 25.6V10.4h3.9l4.2 7.4 4.2-7.4h3.9v15.2h-3.6v-8.9l-3.6 6.3h-1.8l-3.6-6.3v8.9Z" fill="#E8B455"/></svg> Moni ឆ្លើយសារពីបញ្ជីលក់នេះដោយស្វ័យប្រវត្តិ</div>
